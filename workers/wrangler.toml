name = "bill-beacon-notifications"
main = "src/index.js"
compatibility_date = "2026-09-06"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules"
]
keep_vars = true

[vars]
PLAID_ENV = "production"
PLAID_REDIRECT_URI = "https://bill-beacon.pages.dev/"
BANK_RUN_NOW_ENABLED = "false"
BANK_MATCHING_MODE = "preview"
BANK_APPLY_ENABLED = "false"
HOUSEHOLD_CODE_JOINS_ENABLED = "false"

[observability]
enabled = true

[[kv_namespaces]]
binding = "NOTIFICATIONSKV"
id = "840fbd5bbad24c4caedeea2e2233fd82"

[triggers]
crons = [
  "*/5 * * * *",
  "0 0,12 * * *",
  "1-59/5 * * * *"
]
[[durable_objects.bindings]]
name = "HOUSEHOLD_COORDINATOR"
class_name = "HouseholdCodeCoordinator"

[[migrations]]
tag = "household-codes-v1"
new_sqlite_classes = ["HouseholdCodeCoordinator"]