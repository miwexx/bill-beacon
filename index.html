<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bill Beacon">
  <meta name="theme-color" content="#4F46E5">

  <meta
    name="description"
    content="Bill Beacon — shared household bill tracking"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="./icons/bill-beacon-icon.png">
  <link rel="icon" href="./icons/bill-beacon-icon.png">
  <link rel="stylesheet" href="css/style.css?v=household-popup-1">
  <link rel="preload" as="image" href="./icons/startup-screen.jpg">

  <script>
    try {
      const settings = JSON.parse(
        localStorage.getItem("settings") || "{}"
      );

      document.documentElement.setAttribute(
        "data-theme",
        settings.theme === "light" ? "light" : "dark"
      );
    } catch {
      document.documentElement.setAttribute("data-theme", "dark");
    }

    /*
      Initial-screen preference only.
      Firebase still controls authentication and access.
    */
    try {
      const wasSignedOut =
        localStorage.getItem(
          "billbeacon:last-confirmed-signed-out"
        ) === "1";

      document.documentElement.setAttribute(
        "data-bb-startup",
        wasSignedOut ? "login" : "loading"
      );
    } catch {
      document.documentElement.setAttribute(
        "data-bb-startup",
        "loading"
      );
    }
  </script>

  <title>Bill Beacon</title>

  <style id="bb-startup-critical-style">
    /* Show login only during the login phase. */
    html:not([data-bb-startup="login"]) #login-screen {
      display: none !important;
    }

    /* Keep financial screens hidden until the household is ready. */
    html:not([data-bb-startup="ready"]) #app {
      display: none !important;
    }

    /* Startup image with black surrounding space. */
    #bb-startup-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483647;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;
      padding: 28px;

      background-color: #000000;
      background-image: url("./icons/startup-screen.jpg");
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;

      color: #ffffff;
    }

    /*
      Keep normal status text available to screen readers,
      without displaying it over the image.
    */
    #bb-startup-screen > div {
      position: absolute;
      width: 1px !important;
      height: 1px;

      padding: 0;
      margin: -1px;
      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Reveal recovery controls when startup fails or times out. */
    #bb-startup-screen.bb-startup-error > div {
      position: static;
      width: min(340px, 100%) !important;
      height: auto;

      margin: 0;
      padding: 24px;
      overflow: visible;

      clip: auto;
      clip-path: none;
      white-space: normal;
      box-sizing: border-box;

      border: 1px solid #d8dce4;
      border-radius: 18px;

      background: #ffffff;
      color: #202b3d;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    /* Startup caption. */
    #bb-startup-screen::after {
      content: "Logging in…";

      position: absolute;
      top: 60%;
      left: 24px;
      right: 24px;

      text-align: center;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 15px;
      font-weight: 500;
    }

    /* Avoid overlapping the caption with error controls. */
    #bb-startup-screen.bb-startup-error::after {
      display: none;
    }

    /* Remove the splash when login or the app is ready. */
    html[data-bb-startup="login"] #bb-startup-screen,
    html[data-bb-startup="ready"] #bb-startup-screen {
      display: none !important;
    }

    /* Prevent background scrolling during startup. */
    html:not([data-bb-startup="login"]):not([data-bb-startup="ready"]) body {
      overflow: hidden !important;
    }
  </style>

  <script src="js/startup-gate.js?v=step8-3"></script>
</head>

<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo" aria-label="Bill Beacon logo">
        <img
          src="./icons/bill-beacon-icon.png"
          alt="Bill Beacon app icon"
          width="88"
          height="88"
        >
      </div>

      <h1 class="login-title">Bill Beacon</h1>

      <div class="login-form">
        <label class="login-label" for="email-login">
          Email
        </label>

        <input
          id="email-login"
          class="login-input"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="Email"
          required
          disabled
        >

        <label class="login-label" for="password-login">
          Password
        </label>

        <input
          id="password-login"
          class="login-input"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
          disabled
        >

        <button
          id="forgot-password-button"
          class="forgot-password-button"
          type="button"
          disabled
        >
          Forgot password?
        </button>

        <p
          id="login-error"
          class="login-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          id="email-signin-button"
          class="login-button login-button-primary"
          type="button"
          disabled
        >
          Sign In
        </button>

        <button
          id="email-create-button"
          class="login-button login-button-secondary"
          type="button"
          disabled
        >
          Create Account
        </button>
      </div>
    </div>
  </section>

  <div id="app" style="display: none;"></div>

  <script type="module" src="js/firebase-sync.js"></script>
  <script type="module" src="js/firebase-auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings-cleanup.js?v=settings-cleanup-2"></script>
  <script src="js/bill-splits.js"></script>
  <script src="js/bill-splits.js"></script>
<script src="js/bill-popup-cleanup.js"></script>
<script src="js/bill-splits.js"></script>
<script src="js/bill-popup-cleanup.js"></script>
<script src="js/dashboard-status-compact.js"></script>
<script src="js/dashboard-status-compact.js"></script>
<script src="js/dashboard-snapshot-funding.js"></script>
  <script src="js/calendar-preview.js"></script>
  <script src="js/about-legal.js"></script>
  <script type="module" src="js/account-tutorial.js?v=3"></script>
  <script src="js/login-polish.js?v=1"></script>
  <script src="js/more-tools-preview.js?v=1"></script>
  
  <script src="js/more-popup-swipe.js?v=1"></script>
  

  <!-- Reminder test UI disabled: its buildCard() function is missing. -->
</body>
</html>
