<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bill Beacon">
  <meta name="theme-color" content="#4F46E5">

  <meta
    name="description"
    content="Bill Beacon — shared household bill tracking"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">

  <script>
  try {
    const settings = JSON.parse(localStorage.getItem("settings") || "{}");
    const theme = settings.theme || "dark";

    document.documentElement.setAttribute(
      "data-theme",
      theme === "light" ? "light" : "dark"
    );
  } catch {
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>

  <title>Bill Beacon</title>
</head>

<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo" aria-label="Bill Beacon logo">
  <img
    src="icons/icon-192.png"
    alt="Bill Beacon"
    width="88"
    height="88"
  >
</div>

      <h1 class="login-title">Bill Beacon</h1>

      <p class="login-subtitle">
        Sign in to your account.
      </p>

      <div class="login-form">
        <label class="login-label" for="email-login">Email</label>

        <input
          id="email-login"
          class="login-input"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="Email"
          required
        >

        <label class="login-label" for="password-login">Password</label>

        <input
          id="password-login"
          class="login-input"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >

        <p
          id="login-error"
          class="login-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          id="email-signin-button"
          class="login-button login-button-primary"
          type="button"
        >
          Sign In
        </button>

        <button
          id="email-create-button"
          class="login-button login-button-secondary"
          type="button"
        >
          Create Account
        </button>
      </div>
    </div>
  </section>

  <div id="app" style="display: none;"></div>
  <!-- Existing Bill Beacon app code. This remains a normal script. -->
  <script src="js/app.js"></script>
  <!-- Firebase login runs separately from the large Bill Beacon app script. -->
  <script type="module" src="js/firebase-auth.js"></script>


</body>
</html>
