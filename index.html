<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bill Beacon">
  <meta name="theme-color" content="#4F46E5">

  <meta
    name="description"
    content="Bill Beacon — shared household bill tracking"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="./icons/bill-beacon-icon.png">
  <link rel="icon" href="./icons/bill-beacon-icon.png">
  <link rel="stylesheet" href="css/style.css?v=household-popup-1">

  <script>
    try {
      const settings = JSON.parse(
        localStorage.getItem("settings") || "{}"
      );

      const theme = settings.theme || "dark";

      document.documentElement.setAttribute(
        "data-theme",
        theme === "light" ? "light" : "dark"
      );
    } catch {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>

  <title>Bill Beacon</title>

  <style id="bb-startup-critical-style">

#bb-startup-screen::after {
  content: "Logging in…";
  position: absolute;
  top: 60%;
  left: 24px;
  right: 24px;
  text-align: center;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  font-weight: 500;
}

#bb-startup-screen.bb-startup-error::after,
#bb-startup-screen:has(#bb-startup-actions[style*="grid"])::after {
  display: none;
}
    html:not([data-bb-startup="login"]) #login-screen {
      display: none !important;
    }

    html:not([data-bb-startup="ready"]) #app {
      display: none !important;
    }

    #bb-startup-screen {
  position: fixed;
  inset: 0;
  z-index: 2147483647;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 28px;

  background-color: #000000;
  background-image: url("./icons/startup-screen.jpg");
  background-position: center;
  background-size: contain;
  background-repeat: no-repeat;

  color: #202b3d;
}

/* Normal startup: show only the image. */
#bb-startup-screen > div {
  display: none;
}

/* Show recovery controls only if startup fails or takes too long. */
#bb-startup-screen.bb-startup-error > div,
#bb-startup-screen:has(#bb-startup-actions[style*="grid"]) > div {
  display: block;
  padding: 24px;
  border: 1px solid #d8dce4;
  border-radius: 18px;
  background: #ffffff;
  color: #202b3d;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
}

    html[data-bb-startup="login"] #bb-startup-screen,
    html[data-bb-startup="ready"] #bb-startup-screen {
      display: none !important;
    }

    html:not([data-bb-startup="login"]):not([data-bb-startup="ready"]) body {
      overflow: hidden !important;
    }
  </style>

  <script src="js/startup-gate.js?v=step8-1"></script>
</head>

<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo" aria-label="Bill Beacon logo">
        <img
          src="./icons/bill-beacon-icon.png"
          alt="Bill Beacon app icon"
          width="88"
          height="88"
        >
      </div>

      <h1 class="login-title">Bill Beacon</h1>

      <div class="login-form">
        <label class="login-label" for="email-login">
          Email
        </label>

        <input
          id="email-login"
          class="login-input"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="Email"
          required
        >

        <label class="login-label" for="password-login">
          Password
        </label>

        <input
          id="password-login"
          class="login-input"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >

        <button
          id="forgot-password-button"
          class="forgot-password-button"
          type="button"
        >
          Forgot password?
        </button>

        <p
          id="login-error"
          class="login-error"
          role="alert"
          aria-live="polite"
        ></p>

        <button
          id="email-signin-button"
          class="login-button login-button-primary"
          type="button"
        >
          Sign In
        </button>

        <button
          id="email-create-button"
          class="login-button login-button-secondary"
          type="button"
        >
          Create Account
        </button>
      </div>
    </div>
  </section>

  <div id="app" style="display: none;"></div>

  <script type="module" src="js/firebase-sync.js"></script>
  <script type="module" src="js/firebase-auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings-cleanup.js?v=settings-cleanup-2"></script>
  <script src="js/about-legal.js"></script>
  <script type="module" src="js/account-tutorial.js?v=3"></script>
  <script src="js/login-polish.js?v=1"></script>

  <!-- Reminder test UI disabled: its buildCard() function is missing. -->
</body>
</html>
